# ===================================
#  Course Form Field Definitions
# ===================================

fields:

    title:
        label: Title
        span: auto
        placeholder: Enter course title

    price:
        label: Price
        type: number
        step: 0.01
        placeholder: 0.00
        span: auto

tabs:
    fields:

        _description_ruler:
            type: ruler
            tab: Details

        description:
            label: Description
            type: richeditor
            size: small
            toolbarButtons: [bold, italic, underline, '|', formatOL, formatUL, '|', insertLink]
            tab: Details
